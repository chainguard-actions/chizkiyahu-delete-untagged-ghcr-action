name: Test with nonexistent package name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          repository_owner: ${{ github.repository_owner }}
          package_name: this-package-does-not-exist-xyz-12345
          untagged_only: true
          except_untagged_multiplatform: false
          with_sigs: false
          owner_type: user

      - name: Assert num_deleted is zero for nonexistent package
        env:
          NUM_DELETED: ${{ steps.action.outputs.num_deleted }}
        run: |
          echo "num_deleted: $NUM_DELETED"
          # When the package doesn't exist (404), the action returns 0 deletions
          if [ "$NUM_DELETED" != "0" ]; then
            echo "FAIL: expected num_deleted=0 for nonexistent package, got: '$NUM_DELETED'"
            exit 1
          fi
          echo "PASS: num_deleted=0 as expected for nonexistent package"
