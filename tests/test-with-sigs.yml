name: Test with_sigs flag enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: testowner
          owner_type: user
          untagged_only: "true"
          except_untagged_multiplatform: "false"
          with_sigs: "true"

      - name: Assert action ran with with_sigs enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run and fail due to API/auth errors with a fake token,
          # not due to missing setup or argument construction errors.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with with_sigs=true (outcome=$OUTCOME)"
