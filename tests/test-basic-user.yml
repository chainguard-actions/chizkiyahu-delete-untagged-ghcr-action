name: Test basic usage (user owner type)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Python dependencies
        run: pip install requests

      - id: action
        uses: .
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository_owner: ${{ github.repository_owner }}
          repository: ${{ github.repository }}
          package_name: nonexistent-package-for-testing-basic-00001
          owner_type: user
          untagged_only: true
          except_untagged_multiplatform: false

      - name: Assert num_deleted output is a non-negative integer
        env:
          NUM_DELETED: ${{ steps.action.outputs.num_deleted }}
        run: |
          echo "num_deleted: $NUM_DELETED"
          # num_deleted should be a non-negative integer (0 or more)
          if ! echo "$NUM_DELETED" | grep -qE '^[0-9]+$'; then
            echo "FAIL: expected num_deleted to be a non-negative integer, got: '$NUM_DELETED'"
            exit 1
          fi
          echo "PASS: num_deleted=$NUM_DELETED"
