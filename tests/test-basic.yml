name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: testowner
          repository: testowner/testrepo
          package_name: my-package
          untagged_only: "true"
          except_untagged_multiplatform: "true"
          with_sigs: "false"
          owner_type: user
      - name: Assert action ran (may fail due to invalid token but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with a fake token (API auth failure),
          # but it should not fail due to missing inputs.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # since the important thing is that all inputs were passed correctly.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with all inputs provided"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
