name: Test basic usage - delete untagged ghcr
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: test-owner
          repository: test-owner/test-repo
          owner_type: user
          untagged_only: "true"
          except_untagged_multiplatform: "true"
          with_sigs: "false"

      - name: Assert action ran (setup steps completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should either succeed (0 deleted) or fail at API call
          # but NOT fail at setup (Python install, deps). We accept both outcomes.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran to completion (setup steps executed)"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi

      - name: Assert num_deleted output is set when action succeeds
        if: steps.action.outcome == 'success'
        env:
          NUM_DELETED: ${{ steps.action.outputs.num_deleted }}
        run: |
          echo "num_deleted: $NUM_DELETED"
          if [ -z "$NUM_DELETED" ]; then
            echo "FAIL: num_deleted output was not set"
            exit 1
          fi
          echo "PASS: num_deleted=$NUM_DELETED"
