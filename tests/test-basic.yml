name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: test-owner
          repository: test-owner/test-repo
          package_name: test-package
          untagged_only: "true"
          except_untagged_multiplatform: "true"
          owner_type: user
      - name: Assert action ran (output exists or action failed gracefully)
        env:
          NUM_DELETED: ${{ steps.action.outputs.num_deleted }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "num_deleted: $NUM_DELETED"
          # The action may fail due to invalid token (API auth error), which is expected.
          # What matters is that all inputs were accepted and passed through correctly.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid token (expected behavior)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
