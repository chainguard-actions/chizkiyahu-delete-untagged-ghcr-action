name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          repository_owner: test-owner
          repository: test-owner/test-repo
          package_name: test-package
          owner_type: user
          untagged_only: "true"
          except_untagged_multiplatform: "true"
          with_sigs: "false"
        continue-on-error: true
      - name: Assert action ran (may fail due to invalid token but inputs were accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with an invalid token (API auth error),
          # but it should NOT fail due to missing inputs.
          # If outcome is 'failure', that is acceptable (API call fails with fake token).
          # If outcome is 'success', that means 0 packages were deleted (also fine).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all required inputs provided"
