name: Test basic usage with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: test-owner
          repository: test-owner/test-repo
          package_name: test-package
          untagged_only: "true"
          except_untagged_multiplatform: "true"
          with_sigs: "false"
          owner_type: user
      - name: Assert action ran (may fail due to fake token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with a fake token since it calls the GitHub API.
          # We verify the action was invoked (outcome is either success or failure, not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with all required inputs covered"
