name: Test org owner type with package name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: testorg
          repository: testorg/testrepo
          package_name: my-org-package
          untagged_only: "true"
          except_untagged_multiplatform: "false"
          with_sigs: "true"
          owner_type: org
      - name: Assert action ran with org owner_type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with a fake token (API auth failure),
          # but it should not fail due to missing inputs.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with org owner_type and package_name"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
