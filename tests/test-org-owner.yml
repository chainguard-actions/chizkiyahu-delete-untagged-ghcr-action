name: Test org owner type with package name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: fake-token-for-testing
          repository_owner: test-org
          package_name: my-container-image
          owner_type: org
          untagged_only: "true"
          except_untagged_multiplatform: "false"
          with_sigs: "false"
        continue-on-error: true
      - name: Assert action ran with org owner type and package name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail with an invalid token (API auth error),
          # but it should NOT fail due to missing inputs or misconfiguration.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with org owner_type and package_name inputs provided"
