name: Test org owner type with package name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository_owner: test-org
          repository: test-org/test-repo
          package_name: my-container-image
          untagged_only: "true"
          except_untagged_multiplatform: "false"
          owner_type: org
      - name: Assert action ran with org owner type
        env:
          NUM_DELETED: ${{ steps.action.outputs.num_deleted }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "num_deleted: $NUM_DELETED"
          # The action may fail due to invalid token (API auth error), which is expected.
          # What matters is that all inputs including owner_type=org and package_name were accepted.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with org owner type"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with invalid token (expected behavior)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
