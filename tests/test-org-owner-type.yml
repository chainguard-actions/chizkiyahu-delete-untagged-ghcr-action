name: Test org owner type with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: "invalid-token-for-testing"
          repository_owner: "test-org"
          owner_type: "org"
          untagged_only: "true"
          except_untagged_multiplatform: "true"

      - name: Assert action ran and failed with API error for org owner type
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid (API error),
          # not because of a missing dependency or misconfiguration.
          # This validates that the org owner_type path is wired correctly.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid token for org owner type"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
            echo "PASS"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
