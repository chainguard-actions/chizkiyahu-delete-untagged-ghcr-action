name: 'Delete untagged ghcr'
author: 'Chuzkiyahu Raful'
description: 'Delete containers on github container registry without tags'
branding:
  icon: 'trash-2'
  color: 'blue'
inputs:
  token:
    description: >
      Personal access token (PAT) used to fetch the repository. The PAT is configured with the local git config, which enables your scripts to run authenticated git commands. The post-job step removes the PAT. needs delete:packages permissions

    required: true
  repository_owner:
    description: 'The repository owner name'
    default: ${{ github.repository_owner }}
    required: true
  repository:
    description: 'Delete only from repository name'
    default: ${{ github.repository }}
    required: false
  package_name:
    description: 'Delete only from comma separated package names'
    required: false
  untagged_only:
    description: 'Delete only package versions without tag'
    default: true
  except_untagged_multiplatform:
    description: 'Exclude untagged multiplatform packages from deletion (only for --untagged_only)'
    default: true
  owner_type:
    description: "Owner type (org or user)"
    required: true
outputs:
  num_deleted:
    description: 'Number of package versions that were deleted during the run.'
    value: ${{ steps.delete-untagged-ghcr-action.outputs.num_deleted }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.9'
    - name: Install Python dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install -r "$ACTION_PATH/requirements.txt"
    - name: Run action
      id: delete-untagged-ghcr-action
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPOSITORY_OWNER: ${{ inputs.repository_owner }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_PACKAGE_NAME: ${{ inputs.package_name }}
        INPUT_UNTAGGED_ONLY: ${{ inputs.untagged_only }}
        INPUT_EXCEPT_UNTAGGED_MULTIPLATFORM: ${{ inputs.except_untagged_multiplatform }}
        INPUT_OWNER_TYPE: ${{ inputs.owner_type }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        args=( "--token" "$INPUT_TOKEN" )
        args+=( "--repository_owner" "$INPUT_REPOSITORY_OWNER" )
        if [[ -n "$INPUT_REPOSITORY" ]]; then
          args+=( "--repository" "$INPUT_REPOSITORY" )
        fi
        if [[ -n "$INPUT_PACKAGE_NAME" ]]; then
          args+=( "--package_names" "$INPUT_PACKAGE_NAME" )
        fi
        args+=( "--untagged_only" "$INPUT_UNTAGGED_ONLY" )
        args+=( "--except_untagged_multiplatform" "$INPUT_EXCEPT_UNTAGGED_MULTIPLATFORM" )
        args+=( "--owner_type" "$INPUT_OWNER_TYPE" )
        echo "args: ${args[@]}"
        python "$ACTION_PATH/clean_ghcr.py" "${args[@]}"
