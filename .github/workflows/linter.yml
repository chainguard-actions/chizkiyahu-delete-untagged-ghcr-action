name: linter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  formater:
    name: Python Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Cut sha for PR branch name
        shell: bash
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          safe_sha=$(printf '%s' "$GITHUB_SHA_VALUE" | tr -d '\n\r' | cut -c 1-6)
          echo "GITHUB_SHA_SHORT=$safe_sha" >> "$GITHUB_ENV"
          echo "$safe_sha"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'
      - run: pip install yapf
        shell: bash
      - name: run yapf
        id: yapf
        shell: bash
        run: |
          is_formatted=0
          yapf  . --verbose --recursive --diff --parallel > /dev/null || is_formatted=1
          yapf  . --verbose --recursive --in-place --parallel > /dev/null
          echo "IS_FORMATTED=$is_formatted" >> "$GITHUB_ENV"
          echo "is_formatted:  $is_formatted"
      - name: Create Pull Request
        if: ${{ env.IS_FORMATTED != 0 }}
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "Bot action yapf on branch - ${{ github.head_ref }}"
          commit-message: ":art: Format Python code with yapf"
          body: |
            There appear to be some python formatting errors in ${{ github.sha }}. This pull request
            uses the yapf formatter to fix these issues.
          base: ${{ github.head_ref }} # Creates pull request onto pull request or commit branch
          branch: ${{ github.head_ref }}_${{ env.GITHUB_SHA_SHORT }}_yapf
      - name: yapf exit failure
        if: ${{ env.IS_FORMATTED != 0 }}
        run: exit 1
        shell: bash
