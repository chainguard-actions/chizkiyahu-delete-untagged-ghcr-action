name: linter
permissions:
  contents: read
  pull-requests: write
  
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  formater:
    name: Python Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Cut sha for PR branch name
        shell: bash
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          safe_sha=$(printf '%s' "$GITHUB_SHA_VALUE" | tr -d '\n\r' | cut -c 1-6)
          echo "GITHUB_SHA_SHORT=$safe_sha" >> "$GITHUB_ENV"
          echo "$safe_sha"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install yapf
        shell: bash
      - name: run yapf
        id: yapf
        shell: bash
        run: |
          is_formatted=0
          yapf  . --verbose --recursive --diff --parallel > /dev/null || is_formatted=1
          yapf  . --verbose --recursive --in-place --parallel > /dev/null
          echo "IS_FORMATTED=$is_formatted" >> "$GITHUB_ENV"
          echo "is_formatted:  $is_formatted"
      - name: yapf exit failure
        if: ${{ env.IS_FORMATTED != 0 }}
        run: exit 1
        shell: bash
