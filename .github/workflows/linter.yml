name: linter
permissions:
  contents: read
  pull-requests: write
  
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.md'

jobs:
  formater:
    name: Python Formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Cut sha for PR branch name
        shell: bash
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          safe=$(printf '%s' "$FULL_SHA" | tr -d '\n\r' | cut -c 1-6)
          echo "GITHUB_SHA_SHORT=$safe" >> "$GITHUB_ENV"
          echo "$safe"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: pip install yapf
        shell: bash
      - name: run yapf
        id: yapf
        shell: bash
        run: |
          is_formatted=0
          yapf  . --verbose --recursive --diff --parallel > /dev/null || is_formatted=1
          yapf  . --verbose --recursive --in-place --parallel > /dev/null
          echo "IS_FORMATTED=$is_formatted" >> $GITHUB_ENV
          echo "is_formatted:  $is_formatted"
      - name: yapf exit failure
        if: ${{ env.IS_FORMATTED != 0 }}
        run: exit 1
        shell: bash
